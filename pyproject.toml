[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-instagram-ai"
version = "2.1.0"
description = "Production-style intelligent Instagram conversational assistant with persistent memory, intent scoring, and human escalation handoff."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ranjan Prajapati", email = "ranjan@example.com" }
]
keywords = [
    "instagram",
    "fastapi",
    "llm",
    "groq",
    "llama3",
    "ai-assistant",
    "intent-scoring",
    "human-in-the-loop",
    "postgresql",
    "messenger-api"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "SQLAlchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0"
]

[project.urls]
Homepage = "https://github.com/MrRanjan12/InstagramSmart_chat_handler"
Repository = "https://github.com/MrRanjan12/InstagramSmart_chat_handler"
"Bug Tracker" = "https://github.com/MrRanjan12/InstagramSmart_chat_handler/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
