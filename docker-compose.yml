services:
  app:
    build: .
    container_name: instagram_ai_assistant
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-instagram_assistant}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - astra_network

  db:
    image: postgres:16-alpine
    container_name: instagram_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-instagram_assistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-instagram_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - astra_network

volumes:
  postgres_data:
    driver: local

networks:
  astra_network:
    driver: bridge
